<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>NetFlow Analyzer - Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.indigo.min.css"
    >
    <style>
      #root > main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        max-width: 510px;
        margin: 0 auto;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main>
        <h1>Sign in</h1>

        <form action="/login" method="post">
          <input
            type="text"
            name="username"
            placeholder="Login"
            aria-label="Login"
            autocomplete="username"
            required
          >

          <input
            type="password"
            name="password"
            placeholder="Password"
            aria-label="Password"
            autocomplete="current-password"
            required
          >

          <label>
            <input type="checkbox" name="remember" role="switch">
            Remember me
          </label>

          <button type="submit">Login</button>
        </form>
      </main>
    </div>
  </body>
</html>
