<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>NetFlow Analyzer - Alerts</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.indigo.min.css"
    >
    <link rel="stylesheet" href="/static/css/main.css">
  </head>
  <body class="stats-page">
    <div id="root">
      <main>
        <h1>Alerts</h1>

        <table>
          <thead>
            <tr>
              <th>Router</th>
              <th>Source IP</th>
              <th>Destination IP</th>
              <th>Protocol</th>
              <th>Bytes</th>
              <th>Packets</th>
              <th>Alert</th>
            </tr>
          </thead>
          <tbody>
            {% for record in records %}
            <tr>
              <td>{{ record["router-id"] }}</td>
              <td>{{ record["src-address"] }}</td>
              <td>{{ record["dst-address"] }}</td>
              <td>{{ record["protocol"] }}</td>
              <td>{{ record["bytes"] }}</td>
              <td>{{ record["packets"] }}</td>
              <td>High traffic</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>

        <a href="/dashboard.html">Back to dashboard</a>
      </main>
    </div>
  </body>
</html>
